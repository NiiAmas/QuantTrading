version: '3.8'

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: quantbot
      POSTGRES_PASSWORD: ${DB_PASS:-quantbot_secure_pw}
      POSTGRES_DB: quant_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantbot -d quant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend: FastAPI + Bot Engine ───
  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quantbot:${DB_PASS:-quantbot_secure_pw}@db:5432/quant_db
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-super-secret-quant-key-change-me}
    ports:
      - "8000:8000"

  # ─── Frontend: Static build served by nginx ───
  frontend:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pgdata:
